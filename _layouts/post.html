---
layout: default
---

<article class="post-article reveal visible">
  <header class="post-header">
    <a href="{{ '/blog/' | relative_url }}" class="post-back">← Back to blog</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags and page.tags.size > 0 %}
      <div class="post-tags">
        {% for tag in page.tags %}
        <a href="{{ '/blog/tags/#' | append: tag | downcase | replace: ' ', '-' | relative_url }}" class="tag-chip">{{ tag }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
